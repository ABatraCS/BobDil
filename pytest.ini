# Python test configuration.
#
# `pythonpath` rather than an installed package: BobDil's Python is three
# source trees that are run in place (`PYTHONPATH=session python -m bobdil`),
# not a distribution, and adding a packaging step only to make imports resolve
# in tests would mean the tests import something the makefile never runs.
[pytest]
testpaths = tests
pythonpath = session tools codegen
addopts = --strict-markers
